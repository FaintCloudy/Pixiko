# AndroidX 是 appcompat/material 的硬前提。
android.useAndroidX=true
# 本工程没有非 AndroidX 的 support 库，不需要 jetifier（关掉能省一次全量扫描）。
android.enableJetifier=false
# 用 AndroidX 的资源命名空间，避免和第三方库的 R 冲突。
android.nonTransitiveRClass=true
# 构建机内存：默认 512m 跑 AGP 8.x 会 OOM。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 单模块工程并行/缓存意义不大，但缓存开着对反复打包更快。
org.gradle.caching=true
org.gradle.parallel=true
# 明确不要 configuration cache：AGP 8.6 在个别环境下仍会报不可序列化警告，构建噪音大。
org.gradle.configuration-cache=false

# ---------------------------------------------------------------- 依赖下载走的代理（按需打开）
# Gradle daemon 是 fork 出来的独立 JVM，**不会**继承 shell 里的 HTTP_PROXY/HTTPS_PROXY，
# 所以在国内网络下用 Android Studio 或手工 `gradlew` 构建时，可能需要把下面四行的注释去掉，
# 让 Gradle 自己也走本机代理（默认端口 7890）。用仓库自带的 android/build-apk.ps1 构建时
# 脚本会自动注入这几个 JVM 属性，不需要在这里打开。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890

