// :app 模块。刻意用 `apply plugin`（老写法）而不是 `plugins {}`：
// 插件 jar 已经由根 build.gradle 的 buildscript.classpath 拿到，
// 这样 gradle 不必再去 pluginManagement 里解析一次 AGP。
apply plugin: 'com.android.application'

android {
    namespace 'cn.szu.bot.app'
    compileSdk 34

    buildFeatures {
        // AGP 8 默认不再生成 BuildConfig；PixikoApp 里要用 BuildConfig.DEBUG / VERSION_NAME，
        // 所以要显式打开（buildConfigField 之类的能力也一并可用）。
        buildConfig true
    }

    defaultConfig {
        applicationId "cn.szu.bot.app"
        minSdk 26
        targetSdk 34
        versionCode 160
        versionName "1.6.0"
        // 没有自定义 vector drawable / 多密度拆分，保持单一 APK。
        resourceConfigurations += ['zh', 'en']

        // 「构建时烧进去的测试默认服务器地址」：构建脚本 android/build-apk.ps1 每次编包前
        // 探测本机局域网 IP，用 -PpixikoDefaultHost=192.168.x.y:8787 传进来（-NoDefaultHost 则不传）。
        // 这里只把它变成 BuildConfig.PIXIKO_DEFAULT_HOST 字符串常量，**不写死任何 IP 到源码里**：
        // 属性缺失时就是空串，App 行为与没有这个机制时完全一致。
        // 用途只有一个：首次运行时预填到「服务器设置」的地址框（见 SettingsActivity#applyBuildDefaultHost），
        // 不自动连接、不覆盖用户已保存的服务器、更不碰令牌。
        def pixikoDefaultHost = project.hasProperty('pixikoDefaultHost')
                ? project.property('pixikoDefaultHost').toString().trim()
                : ''
        // 只放行地址里合法出现的字符，避免引号 / 反斜杠破坏生成的 BuildConfig.java。
        pixikoDefaultHost = pixikoDefaultHost.replaceAll(/[^0-9A-Za-z._:\-\[\]]/, '')
        buildConfigField "String", "PIXIKO_DEFAULT_HOST", "\"${pixikoDefaultHost}\""
    }

    buildTypes {
        debug {
            // 调试包也保留符号，方便真机看堆栈。
            minifyEnabled false
        }
        release {
            // 本工程不发 release（发布走 debug 签名即可局域网自用）；
            // 真要用 release 时把 signingConfig 配上再打开混淆。
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // 代码里用了极少量 Java 8 API（Base64 的 java.util 版本、Locale.ROOT 等），
        // desugar 打开以免在 minSdk 26 上出意外。
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        // 打包时不跑 lint：lint 失败会挡住 assembleDebug，而我们只关心能编译。
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // 只用 AndroidX 基础件：不引入 Retrofit/OkHttp（HttpURLConnection 够用），
    // 也不引入任何需要联网下载额外代码的插件。
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    // WebViewCompat/WebViewFeature（深色模式与 WebView 版本判断用得上）。
    implementation 'androidx.webkit:webkit:1.11.0'
}
